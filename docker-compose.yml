
services:
    rolex-api:
        container_name: rolex-api
        restart: always
        image: node:20.10.0
        ports: 
        - 4001:3007
        volumes:
        - ./:/usr/src/rolex
        working_dir: /usr/src/rolex

        networks:
        - monorepo-network

    #FOR PRODUCTION
        command: bash -c "npm install && npm run build && npm run start:prod"

    rolex-batch:
        container_name: rolex-batch
        restart: unless-stopped
        image: node:20.10.0
        ports: 
        - 4002:3008
        volumes:
        - ./:/usr/src/rolex
        working_dir: /usr/src/rolex

        networks:
        - monorepo-network

    #FOR PRODUCTION
        command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
 monorepo-network:
  driver: bridge

